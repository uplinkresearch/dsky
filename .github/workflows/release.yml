name: release
on:
  push:
    tags: ["v*"]
  # cut-release.yml calls this after it creates the tag. A tag pushed with the
  # workflow's own token does not start other workflows, so it has to.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build all targets
        run: |
          set -eu
          mkdir -p dist
          VERSION="${TAG}"
          # The first-boot agent is compiled first and embedded into every
          # DSKY, which then stages it onto Windows media from any host.
          ./build-agent.sh "${VERSION}"
          LDFLAGS="-s -w -X github.com/uplinkresearch/dsky/internal/buildinfo.Version=${VERSION}"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/dsky-${VERSION}-${GOOS}-${GOARCH}${ext}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/dsky
          done
          # Windowless launcher for the click-to-launch app (Windows GUI subsystem).
          for GOARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" \
              -o "dist/dsky-app-${VERSION}-windows-${GOARCH}.exe" ./cmd/dsky-app
          done
          cp dsky.ico dist/dsky.ico
          # The Linux app-drawer icon install.sh fetches, hashed with the rest.
          cp dsky.png dist/dsky.png
          # The macOS app icon, for the DSKY.app install.sh builds.
          cp dsky.icns dist/dsky.icns
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The annotated tag's message is the release notes, so what shipped is
          # written once, next to the commits it describes. Kept out of dist/ so
          # it is neither published as an asset nor hashed into SHA256SUMS.
          #
          # Read the tag object through the API. Reading it from local git is a
          # trap: checkout can leave a lightweight ref, and git then quietly
          # falls back to the tagged COMMIT's message — which published one
          # release describing a CI fix instead of the features.
          notes="${RUNNER_TEMP}/notes.md"
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          : > "$notes"
          if [ "$(gh api "$ref" --jq '.object.type')" = "tag" ]; then
            sha=$(gh api "$ref" --jq '.object.sha')
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "Cross-platform builds." > "$notes"
          fi
          # printf, not a heredoc: a heredoc body and its terminator have to sit
          # at column 0, which ends this YAML block scalar early (and `---` there
          # starts a new YAML document), silently truncating the script.
          {
            printf '\n---\n\n'
            printf 'Verify downloads against `SHA256SUMS.txt`. Binaries are unsigned'
            printf ' for now — Windows SmartScreen / Smart App Control may object'
            printf ' until code signing lands.\n'
          } >> "$notes"
          # Converge rather than fail: re-running a release (a fixed workflow,
          # a retag) should correct the existing one, not abort on "already
          # exists" and leave it half-wrong.
          title="DSKY ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # --draft=false --latest are not cosmetic: deleting a tag demotes its
            # release to a draft, so the release a re-run finds is usually one
            # that has to be published again, not merely re-described.
            gh release edit "${TAG}" --title "$title" --notes-file "$notes" \
              --draft=false --latest
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "$title" --notes-file "$notes"
          fi

  # A real click-to-install download for the product page. Runs after the
  # release exists so it only has to add one asset to it.
  installer:
    needs: build
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build the Windows binaries the installer packages
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/uplinkresearch/dsky/internal/buildinfo.Version=${TAG}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" -o dist/dsky.exe ./cmd/dsky
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/dsky-app.exe ./cmd/dsky-app
      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Not every runner image ships it; install rather than fail.
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DAppVersion=$env:TAG installer\dsky.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-Item dist\dsky-setup-amd64.exe | ForEach-Object { "built {0} ({1:N1} MB)" -f $_.Name, ($_.Length/1MB) }
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The product page links to releases/latest/download/dsky-setup-amd64.exe,
          # so this name must stay version-free and must land on every release.
          sha=$(sha256sum dist/dsky-setup-amd64.exe | cut -d' ' -f1)
          echo "$sha  dsky-setup-amd64.exe" > dist/dsky-setup-amd64.exe.sha256
          gh release upload "${TAG}" \
            dist/dsky-setup-amd64.exe dist/dsky-setup-amd64.exe.sha256 --clobber
