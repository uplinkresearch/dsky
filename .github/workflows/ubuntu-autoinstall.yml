name: linux-install
# DSKY's hands-off Linux installs were only ever checked against a synthetic
# ISO. This builds media from the real ISOs, installs from it in a KVM virtual
# machine onto a blank virtual disk, and asks the installed system what it got
# (docs/plan-linux-apps.md). Two mechanisms are covered: Ubuntu's autoinstall,
# from a CIDATA partition with GRUB rewritten in place, and Anaconda's
# kickstart, handed to the kernel as a second initramfs.
#
# Each case downloads a 3-6 GB ISO and runs a full install, so this runs by
# hand and when the Linux compose code changes, not on every push.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "One case, or blank for all"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - internal/compose/linux.go
      - internal/compose/cpio.go
      - internal/oscatalog/fedora.go
      - internal/oscatalog/ubuntu.go
      - test/autoinstall/**
      - .github/workflows/ubuntu-autoinstall.yml

permissions:
  contents: read

jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        case:
          - server-24.04
          - server-26.04
          - desktop-26.04
          - desktop-26.04-prompt
          - server-26.04-programs
          - desktop-26.04-programs
          - server-26.04-drivers
          - fedora-44-kickstart
          - fedora-44-programs
          - omarchy
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Skip cases not asked for
        id: want
        run: |
          if [ -z "${{ inputs.case }}" ] || [ "${{ inputs.case }}" = "${{ matrix.case }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
      - uses: actions/setup-go@v5
        if: steps.want.outputs.run == 'true'
        with:
          go-version: "1.27"

      # A desktop case holds the ISO, the built image (a copy of it) and a
      # growing target disk at once; the runner's preinstalled SDKs are not
      # needed and take most of the disk.
      - name: Make room, enable KVM, install QEMU
        if: steps.want.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils ovmf socat imagemagick
          ls -l /dev/kvm

      - name: Build media with DSKY, install it in a VM, check the result
        if: steps.want.outputs.run == 'true'
        run: test/autoinstall/vm.sh "${{ matrix.case }}" "$RUNNER_TEMP/ai"

      - name: Summary
        if: always() && steps.want.outputs.run == 'true'
        run: cat "$RUNNER_TEMP/ai/result.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: autoinstall-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/ai/shots/*.png
            ${{ runner.temp }}/ai/result.md
            ${{ runner.temp }}/ai/build.log
            ${{ runner.temp }}/ai/system.txt
            ${{ runner.temp }}/ai/serial-*.log
            ${{ runner.temp }}/ai/dsky-apps.log
            ${{ runner.temp }}/ai/generated-user-data.yaml
          if-no-files-found: warn
