name: catalog-health

# The catalog pins URLs at distros that move and prune. A pinned URL that has
# become a 404 is invisible to ci.yml, which runs -short and so skips every
# network test: the build passes, the index publishes, and the first person to
# find out is a user whose download fails.
#
# This runs the network tests on a schedule so link rot reaches the maintainer
# first. It also checks that every winget package in the program list still
# exists. It checks reachability, not content — verifying the bytes would mean
# downloading well over a hundred gigabytes, and a changed file is already
# caught by the pinned hash at pull time.

on:
  schedule:
    # Mondays, 07:00 UTC. Weekly is the right cadence: these URLs rot on the
    # order of months (a distro point release), and the cost of learning a few
    # days late is one failed download.
    - cron: "0 7 * * 1"
  workflow_dispatch: # so it can be run by hand after re-pinning something

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # No -short: that is the whole point. -run selects the two live tests so
      # a failure here always means the catalog, never unrelated code.
      - name: Check every catalog URL and checksum file
        id: check
        run: |
          set -o pipefail
          go test ./internal/oscatalog/ -count=1 -timeout 20m -v \
            -run 'TestCatalogURLsLive|TestResolveChecksumLive' 2>&1 | tee result.txt

      # An ISO with one place to come from is one bad minute away from a
      # failed build, and a mirror that has dropped a release says nothing
      # until someone is 3 GiB into downloading from it. Checked here rather
      # than discovered there. Runs even when the URL check failed, so one
      # issue says everything that broke this week.
      - name: Check every mirrored ISO still has a fallback
        id: mirrors
        if: always()
        run: |
          set -o pipefail
          go test ./internal/fetch/ -count=1 -timeout 10m -v \
            -run 'TestMirrorsLive' 2>&1 | tee mirrors.txt

      # The program list names winget packages, and vendors rename them (a
      # new Python version is a new id). Each is looked up in winget's own
      # repository, spelled as listed. The job token lifts GitHub's
      # unauthenticated limit of 60 requests an hour, which ninety lookups
      # would exceed. Runs even when the OS check failed, so one issue says
      # everything that broke that week.
      - name: Check every winget package id in the program list
        id: winget
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Both in one invocation, on purpose: the walk to a package's
          # folder is cached per process, and the second test reads the
          # installer manifest in the folder the first one found. Split
          # across two runs they would walk the whole repository twice.
          #
          # The second is what notices an offline build quietly losing a
          # program: a package that stops being one that can go on a stick is
          # reported and not failed (Store packages and archives genuinely
          # cannot), but a manifest shape the reader no longer understands
          # fails, because that is how every program would start being
          # refused at once.
          go test ./internal/appcatalog/ -count=1 -timeout 20m -v \
            -run 'TestWingetIDsLive|TestPrePullableLive' 2>&1 | tee winget.txt
          # The runtimes a migration installs before everything else are not
          # in the picker's list, so they need checking too.
          go test ./internal/migrate/ -count=1 -timeout 10m -v \
            -run 'TestBuiltinTableIDsLive' 2>&1 | tee -a winget.txt

      # The Ubuntu program list names apt packages, snaps and Flathub apps,
      # which rot the same way winget ids do: a package dropped between
      # releases, a snap renamed, a Flathub app whose publisher verification
      # has lapsed. Each is looked up where it comes from. The vendor
      # repositories DSKY adds by hand are checked for their signing key and
      # their package list at the same time.
      - name: Check every Linux package name in the program list
        id: ubuntu
        if: always()
        run: |
          set -o pipefail
          go test ./internal/appcatalog/ -count=1 -timeout 20m -v \
            -run 'TestUbuntuNamesLive|TestUbuntuVendorReposLive|TestUbuntuReleasesLive|TestFedoraNamesLive|TestFedoraVendorReposLive|TestVendorKeysLive' 2>&1 | tee ubuntu.txt

      # Only the failing lines, so the issue says what rotted rather than
      # burying it in 27 successes.
      - name: Summarise what broke
        if: failure()
        run: |
          {
            echo "## Catalog entries needing attention"
            echo
            echo '```'
            grep -E "oscatalog_test.go:[0-9]+: [a-z0-9.-]+:" result.txt | grep -v ": ok (" || true
            grep -E "appcatalog_test.go:[0-9]+: " winget.txt | grep -v ": ok$" || true
            # A package that cannot go on a stick is reported, not failed, so
            # it is dropped here with the successes: the summary is for what
            # broke this week.
            grep -E "prepulllive_test.go:[0-9]+: " winget.txt \
              | grep -v ": ok$" | grep -v ": cannot ride on a stick: " || true
            grep -E "ubuntulive_test.go:[0-9]+: " ubuntu.txt | grep -v ": ok$" || true
            grep -E "vendorkeyslive_test.go:[0-9]+: " ubuntu.txt | grep -v " ok$" || true
            grep -E "mirrorslive_test.go:[0-9]+: " mirrors.txt || true
            echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # A failed scheduled run sends no notification anyone reads, so it
      # becomes an issue. Reused rather than reopened per week: one issue that
      # accumulates comments beats a new one every Monday.
      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog link rot: an OS download or a program package is failing"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          body="$(cat summary.md)

          Found by the scheduled catalog-health run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          For an OS, re-pin the entry in \`internal/oscatalog/builtin.go\`, then
          regenerate and re-sign the index with \`go run ./test/catalogen\`.
          For a program, correct its winget id in \`internal/appcatalog/appcatalog.go\`
          (\`dsky apps winget <id>\` checks one), or remove it."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
